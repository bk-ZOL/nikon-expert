version: "3.8"

services:
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data
      - ../models:/app/models:ro
    environment:
      - BACKEND_MODE=remote
      - EMBED_DEVICE=cuda
      - LLM_BASE_URL=http://host.docker.internal:11434
      - LLM_MODEL=qwen2.5:7b-instruct-q8_0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  ui:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "7860:7860"
    environment:
      - BACKEND_MODE=remote
      - API_BASE_URL=http://backend:8000
    depends_on:
      - backend
    command: ["python", "ui/app.py"]
    restart: unless-stopped
