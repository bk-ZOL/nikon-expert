<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PDF Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f8f9fa; height: 100vh; display: flex; flex-direction: column; }
  .toolbar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #fff; border-bottom: 1px solid #e0e0e0; flex-shrink: 0; }
  .toolbar .doc-name { font-size: 13px; color: #333; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toolbar button { background: #f0f0f0; border: 1px solid #ddd; border-radius: 4px; padding: 4px 10px; font-size: 12px; cursor: pointer; color: #555; }
  .toolbar button:hover { background: #e8e8e8; }
  .page-info { font-size: 12px; color: #888; min-width: 60px; text-align: center; }
  #viewer-container { flex: 1; position: relative; }
  #pdf-frame { width: 100%; height: 100%; border: none; }
  .empty-state { display: flex; align-items: center; justify-content: center; height: 100%; color: #aaa; font-size: 14px; }
</style>
</head>
<body>
  <div class="toolbar">
    <span class="doc-name" id="docName">PDF Viewer</span>
    <button onclick="prevPage()" title="上一页">◀</button>
    <span class="page-info" id="pageInfo">— / —</span>
    <button onclick="nextPage()" title="下一页">▶</button>
    <button onclick="zoomIn()" title="放大">＋</button>
    <button onclick="zoomOut()" title="缩小">－</button>
    <button onclick="zoomFit()" title="适应宽度">↔</button>
  </div>
  <div id="viewer-container">
    <div class="empty-state" id="emptyState">
      点击引用按钮预览原文
    </div>
    <iframe id="pdf-frame" style="display:none;"></iframe>
  </div>

<script>
  var currentPage = 1;
  var totalPages = 1;

  function showPdf(url, page) {
    var frame = document.getElementById('pdf-frame');
    var empty = document.getElementById('emptyState');
    var nameEl = document.getElementById('docName');
    var infoEl = document.getElementById('pageInfo');

    frame.style.display = 'block';
    empty.style.display = 'none';
    currentPage = page || 1;

    // 从路径提取文件名
    var parts = url.replace(/\\/g, '/').split('/');
    nameEl.textContent = parts[parts.length - 1] || 'PDF';
    infoEl.textContent = currentPage + ' / —';

    var viewerUrl = '/pdf-viewer-renderer?file=' + encodeURIComponent(url) + '&page=' + currentPage;
    frame.src = viewerUrl;
  }

  function goToPage(n) {
    currentPage = Math.max(1, Math.min(n, totalPages));
    var frame = document.getElementById('pdf-frame');
    try {
      frame.contentWindow.postMessage({ type: 'GO_TO_PAGE', page: currentPage }, '*');
      document.getElementById('pageInfo').textContent = currentPage + ' / ' + totalPages;
    } catch(e) {}
  }

  function prevPage() { goToPage(currentPage - 1); }
  function nextPage() { goToPage(currentPage + 1); }
  function zoomIn() { try { document.getElementById('pdf-frame').contentWindow.postMessage({ type: 'ZOOM_IN' }, '*'); } catch(e) {} }
  function zoomOut() { try { document.getElementById('pdf-frame').contentWindow.postMessage({ type: 'ZOOM_OUT' }, '*'); } catch(e) {} }
  function zoomFit() { try { document.getElementById('pdf-frame').contentWindow.postMessage({ type: 'ZOOM_FIT' }, '*'); } catch(e) {} }

  // 监听来自 PDF.js 渲染器 iframe 的消息
  window.addEventListener('message', function(e) {
    if (!e.data || !e.data.type) return;
    if (e.data.type === 'PDF_READY') {
      totalPages = e.data.pages || 1;
      document.getElementById('pageInfo').textContent = currentPage + ' / ' + totalPages;
    }
  });
</script>
</body>
</html>
